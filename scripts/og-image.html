<!doctype html>
<!-- Fonte da imagem de compartilhamento (public/og-image.jpg, 1200×630).
     Pra refazer: abrir este arquivo com o dev server rodando (/scripts/og-image.html)
     numa janela de 1200×630 e capturar a tela. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
@font-face { font-family: 'Geist'; src: url('/fonts/geist.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Pixelify Sans'; src: url('/fonts/pixelify-sans-500.woff2') format('woff2'); font-weight: 500; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: 'Geist', sans-serif; color: #0d1b2a; background: linear-gradient(#a9d4f2, #e6f3fb 75%); }
.txt { position: absolute; left: 72px; top: 96px; width: 640px; }
.avail { display: inline-flex; align-items: center; gap: 10px; font: 500 24px 'Pixelify Sans'; background: #fff; border: 3px solid #0d1b2a; padding: 6px 14px; }
.avail::before { content: ''; width: 14px; height: 14px; background: #52b788; border: 3px solid #0d1b2a; }
h1 { font-size: 104px; line-height: 0.95; letter-spacing: -0.035em; margin: 26px 0 20px; }
.role { font-size: 40px; font-weight: 600; }
.stack { font-size: 28px; color: #44586e; margin-top: 8px; }
.win { position: absolute; right: 72px; top: 64px; width: 340px; background: #fff; border: 3px solid #0d1b2a; box-shadow: 10px 10px 0 #0d1b2a; }
.bar { background: #0d1b2a; color: #e0e1dd; font: 500 22px 'Pixelify Sans'; padding: 8px 14px; }
.win img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 15%; }
svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 150px; }
</style>
</head>
<body>
  <div class="txt">
    <span class="avail">Estágio e júnior, remoto</span>
    <h1>Lucas Roldão</h1>
    <p class="role">Desenvolvedor Front-end</p>
    <p class="stack">React · Next.js · TypeScript · Supabase</p>
  </div>
  <div class="win"><div class="bar">lucas.jpg</div><img src="/img/lucas-retrato-540.webp" alt="" /></div>
  <svg viewBox="0 0 1440 170" preserveAspectRatio="none"><path fill="#7cc48f" d="M0 110 C 260 20, 520 40, 800 100 S 1260 150, 1440 70 V170 H0 Z"/><path fill="#3f9a63" d="M0 150 C 300 70, 620 150, 900 120 S 1300 60, 1440 120 V170 H0 Z"/></svg>
</body>
</html>
